<div class="confirm-backdrop" *ngIf="request" (click)="onCancel()">
  <div
    class="confirm-dialog"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="request.title || 'Επιβεβαίωση'"
    (click)="$event.stopPropagation()">

    <h3 class="confirm-title">{{ request.title || 'Επιβεβαίωση' }}</h3>
    <p class="confirm-message">{{ request.message }}</p>

    <div class="confirm-actions">
      <button type="button" class="confirm-btn confirm-btn-cancel" (click)="onCancel()">
        {{ request.cancelText || 'Άκυρο' }}
      </button>
      <button
        type="button"
        class="confirm-btn confirm-btn-ok"
        [class.confirm-btn-danger]="request.danger"
        (click)="onConfirm()">
        {{ request.confirmText || 'OK' }}
      </button>
    </div>
  </div>
</div>
