<div class="container">
  <ng-container *ngIf="status === 'loading'">
    <h2>Επιβεβαίωση Email</h2>
    <p class="subtitle">Επιβεβαιώνουμε το email σου...</p>
  </ng-container>

  <ng-container *ngIf="status === 'success'">
    <div class="success-box">
      <div class="success-icon">✅</div>
      <h3>Επιτυχία!</h3>
      <p>Το email σου επιβεβαιώθηκε.</p>
    </div>
  </ng-container>

  <ng-container *ngIf="status === 'error' || status === 'missing-token'">
    <h2>Μη έγκυρος σύνδεσμος</h2>
    <p class="subtitle">{{ status === 'missing-token' ? 'Ο σύνδεσμος επιβεβαίωσης δεν είναι έγκυρος.' : errorMessage }}</p>
  </ng-container>

  <p class="back-link">
    <a routerLink="/dashboard">← Πίσω στο κατάστημα</a>
  </p>
</div>
